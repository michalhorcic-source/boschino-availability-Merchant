name: Run Margin labels once 2026-09-09

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-margin-labels-once-20260909.yml"

permissions:
  contents: read
  id-token: write

jobs:
  apply-margin-labels:
    if: ${{ github.event.head_commit.message == 'Run Margin labels once 2026-09-09' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run read-only audit v2
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_API_VERSION: "2026-04"
          VAT_CZ: "0.21"
          VAT_SK: "0.23"
        run: python scripts/merchant_margin_labels_audit_v2.py

      - name: Apply custom_label_3 margins
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_API_VERSION: "2026-04"
          VAT_CZ: "0.21"
          VAT_SK: "0.23"
        run: python scripts/merchant_margin_labels_apply_v3.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: margin-labels-once-${{ github.run_id }}
          path: |
            out/margin-labels-v2/
            out/margin-labels-apply/
          if-no-files-found: warn
          retention-days: 30
