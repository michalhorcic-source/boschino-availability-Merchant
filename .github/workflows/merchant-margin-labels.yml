name: Boschino Merchant margin labels
run-name: Merchant margin labels audit v2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  margin-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run margin labels read-only audit v2
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_API_VERSION: "2026-04"
          VAT_CZ: "0.21"
          VAT_SK: "0.23"
        run: python scripts/merchant_margin_labels_audit_v2.py

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-margin-labels-v2-${{ github.run_id }}
          path: out/margin-labels-v2/
          if-no-files-found: warn
          retention-days: 14
