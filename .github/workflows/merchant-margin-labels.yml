name: Boschino Merchant margin labels
run-name: Merchant margin labels - ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only, or apply custom_label_3"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read
  id-token: write

jobs:
  margin-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run margin labels
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_API_VERSION: "2026-04"
          VAT_CZ: "0.21"
          VAT_SK: "0.23"
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "apply" ]; then
            python scripts/merchant_margin_labels.py --apply
          else
            python scripts/merchant_margin_labels.py
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-margin-labels-${{ github.run_id }}
          path: out/margin-labels/
          if-no-files-found: warn
          retention-days: 14
