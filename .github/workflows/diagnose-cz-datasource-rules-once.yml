name: Diagnose CZ Merchant datasource rules once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cz-datasource-rules-once.yml"
      - "scripts/diagnose_cz_datasource_rules.py"

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect CZ Merchant datasource rules
        env:
          CZ_MERCHANT_ACCOUNT_ID: "5757276720"
        run: python scripts/diagnose_cz_datasource_rules.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cz-datasource-rules-${{ github.run_id }}
          path: out/cz-datasource-rules/datasources.json
          if-no-files-found: warn
          retention-days: 30
