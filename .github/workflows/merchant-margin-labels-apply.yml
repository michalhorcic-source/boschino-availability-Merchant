name: Boschino Merchant margin labels apply

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_MARGIN_LABEL_3"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: boschino-merchant-margin-labels-apply
  cancel-in-progress: false

jobs:
  apply-margin-labels:
    if: ${{ github.event_name == 'schedule' || inputs.confirmation == 'APPLY_MARGIN_LABEL_3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run read-only audit v2
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_API_VERSION: "2026-04"
          VAT_CZ: "0.21"
          VAT_SK: "0.23"
        run: python scripts/merchant_margin_labels_audit_v2.py

      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-margin-labels-preflight-${{ github.run_id }}
          path: out/margin-labels-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Apply custom_label_3 margins
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_API_VERSION: "2026-04"
          VAT_CZ: "0.21"
          VAT_SK: "0.23"
        run: python scripts/merchant_margin_labels_apply_v3.py

      - name: Upload apply artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-margin-labels-apply-${{ github.run_id }}
          path: out/margin-labels-apply/
          if-no-files-found: warn
          retention-days: 30
